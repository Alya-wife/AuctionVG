<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Inventory – NitipPro Card Inventory</title>
  <meta name="description" content="Kelola inventory kartu Vanguard konsinyasi" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ── Status Filter Pills ── */
    .status-filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .status-filter-group label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-secondary, #8898aa);
      white-space: nowrap;
      margin-right: 2px;
    }
    .status-pill {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--text-secondary, #8898aa);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .status-pill:hover {
      border-color: rgba(255,255,255,.3);
      color: var(--text-primary, #f0f4ff);
      background: rgba(255,255,255,.06);
    }
    .status-pill.active[data-status=""] {
      border-color: #8898aa;
      background: rgba(136,152,170,.15);
      color: #d0dce8;
    }
    .status-pill.active[data-status="Available"] {
      border-color: #10b981;
      background: rgba(16,185,129,.15);
      color: #10b981;
    }
    .status-pill.active[data-status="Auction"] {
      border-color: #f59e0b;
      background: rgba(245,158,11,.15);
      color: #f59e0b;
    }
    .status-pill.active[data-status="Waiting Shipment"] {
      border-color: #4F8EF7;
      background: rgba(79,142,247,.15);
      color: #4F8EF7;
    }
    .status-pill.active[data-status="Waiting Payment"] {
      border-color: #a78bfa;
      background: rgba(167,139,250,.15);
      color: #a78bfa;
    }
    .status-pill.active[data-status="Completed"] {
      border-color: #6b7a90;
      background: rgba(107,122,144,.12);
      color: #9aacbe;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar (same template) -->
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburgerBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="page-title">
          <h2>Inventory Kartu</h2>
          <span>Kelola semua kartu konsinyasi</span>
        </div>
        <div class="top-bar-right">
          <button class="btn-primary" id="btnAddCard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah Kartu
          </button>
        </div>
      </header>

      <div class="content-body">
        <!-- Filters -->
        <div class="filter-bar">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari kartu, pemilik, set promo..." />
          </div>
          <select id="filterOwner" class="filter-select">
            <option value="">Semua Pemilik</option>
          </select>
          <select id="filterSet" class="filter-select">
            <option value="">Semua Set Promo</option>
          </select>
          <select id="filterGrade" class="filter-select">
            <option value="">Semua Grade</option>
            <option value="0">Grade 0</option>
            <option value="1">Grade 1</option>
            <option value="2">Grade 2</option>
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
          </select>
          <select id="filterType" class="filter-select">
            <option value="">Semua Bahasa</option>
            <option value="JP">JP (Jepang)</option>
            <option value="EN">EN (Inggris)</option>
          </select>
          <select id="filterNation" class="filter-select">
            <option value="">Semua Nation</option>
            <option value="Dragon Empire">Dragon Empire</option>
            <option value="Dark States">Dark States</option>
            <option value="Stoicheia">Stoicheia</option>
            <option value="Lyrical Monasterio">Lyrical Monasterio</option>
            <option value="Brandt Gate">Brandt Gate</option>
            <option value="Keter Sanctuary">Keter Sanctuary</option>
          </select>
          <button class="btn-ghost" id="resetFilter">Reset</button>
        </div>

        <!-- Status Filter Pills -->
        <div class="status-filter-group" id="statusFilterGroup">
          <label>Status:</label>
          <button class="status-pill active" data-status="Available" id="pillAvailable">Available</button>
          <button class="status-pill" data-status="Auction" id="pillAuction">Lelang</button>
          <button class="status-pill" data-status="Waiting Shipment" id="pillWaitShip">Waiting Shipment</button>
          <button class="status-pill" data-status="Waiting Payment" id="pillWaitPay">Waiting Payment</button>
          <button class="status-pill" data-status="Completed" id="pillCompleted">Completed</button>
          <button class="status-pill" data-status="" id="pillAll">Semua</button>
        </div>

        <!-- Sort Bar -->
        <div class="sort-bar">
          <span id="totalCount" class="record-count">– kartu</span>
          <div class="sort-controls">
            <label>Urut:</label>
            <select id="sortBy" class="filter-select-sm">
              <option value="date_desc">Terbaru</option>
              <option value="date_asc">Terlama</option>
              <option value="name_asc">Nama A–Z</option>
              <option value="name_desc">Nama Z–A</option>
            </select>
          </div>
          <div class="view-toggle">
            <button class="view-btn active" id="viewGrid" aria-label="Grid view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button class="view-btn" id="viewList" aria-label="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>

        <!-- Cards Grid -->
        <div id="inventoryGrid" class="inventory-grid">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Memuat inventory...</p>
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- Modal: Add Card from Database Visual Gallery -->
  <div class="modal-overlay" id="modalCard">
    <div class="modal-box large">
      <div class="modal-header">
        <h3 id="modalCardTitle">Pilih Kartu dari Database</h3>
        <button class="modal-close" id="modalCardClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-form">
        <!-- Filter Bar di dalam Modal Picker -->
        <div class="card-picker-filter-row">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="modalPickerSearch" placeholder="Cari kartu promo di database..." />
          </div>
          <select id="modalPickerSet" class="filter-select">
            <option value="">Semua Set Promo</option>
          </select>
          <select id="modalPickerNation" class="filter-select">
            <option value="">Semua Nation</option>
            <option value="Dragon Empire">Dragon Empire</option>
            <option value="Dark States">Dark States</option>
            <option value="Stoicheia">Stoicheia</option>
            <option value="Lyrical Monasterio">Lyrical Monasterio</option>
            <option value="Brandt Gate">Brandt Gate</option>
            <option value="Keter Sanctuary">Keter Sanctuary</option>
          </select>
          <select id="modalPickerGrade" class="filter-select">
            <option value="">Semua Grade</option>
            <option value="0">Grade 0</option>
            <option value="1">Grade 1</option>
            <option value="2">Grade 2</option>
            <option value="3">Grade 3</option>
            <option value="4">Grade 4</option>
          </select>
        </div>

        <p class="modal-subtitle" style="margin-bottom:8px;">
          👉 <strong>Klik gambar kartu</strong> yang ingin dimasukkan ke inventory:
        </p>

        <!-- Galeri Visual Kartu -->
        <div class="card-picker-gallery" id="pickerCardsGallery"></div>

        <!-- Form Kartu Terpilih & Input Sederhana -->
        <form id="cardForm">
          <input type="hidden" id="cardId" />
          <input type="hidden" id="cardName" />
          <input type="hidden" id="cardSet" />
          <input type="hidden" id="cardGrade" />
          <input type="hidden" id="cardType" />
          <input type="hidden" id="cardNation" />
          <input type="hidden" id="cardImage" />

          <!-- Selected card banner -->
          <div class="selected-card-banner" id="selectedCardBanner" style="display: none;">
            <div class="selected-card-thumb">
              <img id="selectedCardThumbImg" src="assets/images/cards/placeholder_card.svg" alt="Kartu" onerror="this.onerror=null; this.src='assets/images/cards/placeholder_card.svg';" />
            </div>
            <div class="selected-card-details">
              <h4 id="selectedCardTitle">-</h4>
              <div class="card-preview-badges">
                <span class="badge-grade" id="selectedCardGrade">Grade -</span>
                <span class="badge-nation" id="selectedCardNation">-</span>
                <span class="badge-lang jp" id="selectedCardLang">JP</span>
                <span style="font-size:0.75rem; color:#38bdf8;" id="selectedCardSet">-</span>
              </div>
            </div>
          </div>

          <!-- Hanya 2 input yang perlu diisi user! -->
          <div class="form-row">
            <div class="form-group">
              <label for="cardOwner">Nama Pemilik Kartu *</label>
              <input type="text" id="cardOwner" required placeholder="cth. Budi" list="ownerList" />
              <datalist id="ownerList"></datalist>
            </div>
            <div class="form-group">
              <label for="cardDateReceived">Tanggal Diterima *</label>
              <input type="date" id="cardDateReceived" required />
            </div>
          </div>

          <div class="modal-footer" style="padding-top:10px; margin-top:0;">
            <a href="cards.html" class="btn-ghost" style="margin-right:auto;font-size:0.82rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              Buka Database Kartu →
            </a>
            <button type="button" class="btn-ghost" id="cancelCardBtn">Batal</button>
            <button type="submit" class="btn-primary" id="saveCardBtn">
              <span>Simpan Kartu ke Inventory</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: Mark Sold -->
  <div class="modal-overlay" id="modalSold">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Tandai Terjual</h3>
        <button class="modal-close" id="modalSoldClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="soldForm" class="modal-form">
        <input type="hidden" id="soldCardId" />
        <p class="modal-subtitle">Kartu: <strong id="soldCardName"></strong></p>
        <div class="form-group">
          <label for="soldBuyer">Nama Pembeli *</label>
          <input type="text" id="soldBuyer" required placeholder="Nama pembeli" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="soldPrice">Harga Jual (Rp) *</label>
            <div class="commission-input-wrap">
              <span class="prefix">Rp</span>
              <input type="text" class="currency-input" id="soldPrice" required placeholder="150000" />
            </div>
          </div>
          <div class="form-group">
            <label for="soldDate">Tanggal Jual *</label>
            <input type="date" id="soldDate" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="cancelSoldBtn">Batal</button>
          <button type="submit" class="btn-primary">Konfirmasi Terjual</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Detail Card -->
  <div class="modal-overlay" id="modalDetail">
    <div class="modal-box large">
      <div class="modal-header">
        <h3>Detail Kartu</h3>
        <button class="modal-close" id="modalDetailClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div id="cardDetailContent" class="card-detail-content"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/cards-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/inventory.js"></script>
</body>
</html>
