<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="holoGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect x="6" y="6" width="288" height="408" rx="14" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-width="3"/>
  <rect x="14" y="14" width="272" height="392" rx="10" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="150" cy="180" r="110" fill="url(#holoGlow)"/>

  <!-- Card Art Area -->
  <rect x="24" y="24" width="252" height="240" rx="8" fill="#141e33" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- Card Artwork Placeholder Art -->
  <g transform="translate(150, 140)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-10" r="45" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="0,-45 35,20 -35,20" stroke="#f59e0b" stroke-width="2.5" fill="rgba(245, 158, 11, 0.08)"/>
    <circle cx="0" cy="-2" r="12" fill="#6366f1" fill-opacity="0.5" stroke="#a5b4fc" stroke-width="1.5"/>
    <path d="M-22,38 L22,38" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-15,44 L15,44" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Vanguard / Logo Emblem -->
  <rect x="36" y="274" width="228" height="114" rx="6" fill="#0b1120" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="150" y="310" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" letter-spacing="1">CARD ARTWORK</text>
  <text x="150" y="332" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Simpan gambar kartu di folder</text>
  <text x="150" y="350" text-anchor="middle" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="bold">assets/images/cards/</text>
  <text x="150" y="372" text-anchor="middle" fill="#f59e0b" font-family="'Outfit', sans-serif" font-weight="600" font-size="11">PROMO EDITION</text>
</svg>
