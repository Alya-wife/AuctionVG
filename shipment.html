<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Pengiriman – NitipPro Card Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ── Batch Toolbar ── */
    .batch-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(79,142,247,.12), rgba(123,92,247,.08));
      border: 1px solid rgba(79,142,247,.25);
      border-radius: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      transition: all .3s ease;
    }
    .batch-toolbar .batch-count {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-secondary, #8898aa);
      flex: 1;
    }
    .batch-toolbar .batch-count span {
      color: #4F8EF7;
      font-size: 1rem;
    }
    .batch-toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-select-all {
      font-size: .8rem;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid rgba(79,142,247,.4);
      background: transparent;
      color: #4F8EF7;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s;
    }
    .btn-select-all:hover { background: rgba(79,142,247,.1); }
    .btn-batch-ship {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #4F8EF7, #7B5CF7);
      color: #fff;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(79,142,247,.4);
      transition: all .2s;
    }
    .btn-batch-ship:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(79,142,247,.5); }
    .btn-batch-ship:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Checkbox column ── */
    .col-check { width: 44px; text-align: center; }
    .ship-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4F8EF7;
    }
    .check-all-box {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4F8EF7;
    }

    /* Row highlight when checked */
    tr.row-selected {
      background: rgba(79,142,247,.07) !important;
    }
    tr.row-selected td { border-color: rgba(79,142,247,.15) !important; }

    /* ── Batch modal card list ── */
    .batch-card-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border, rgba(255,255,255,.08));
      border-radius: 10px;
      margin-bottom: 4px;
      background: var(--bg-secondary, rgba(255,255,255,.03));
    }
    .batch-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border, rgba(255,255,255,.05));
      font-size: .85rem;
    }
    .batch-card-item:last-child { border-bottom: none; }
    .batch-card-item .bci-name { font-weight: 600; flex: 1; }
    .batch-card-item .bci-buyer { color: var(--text-secondary, #8898aa); font-size: .8rem; }
    .batch-card-item .bci-price { color: #4F8EF7; font-size: .8rem; font-weight: 600; }
    .batch-summary-note {
      font-size: .78rem;
      color: var(--text-secondary, #8898aa);
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburgerBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="page-title">
          <h2>Pengiriman</h2>
          <span>Kartu terjual yang belum dikirim</span>
        </div>
      </header>
      <div class="content-body">
        <!-- Batch Toolbar -->
        <div class="batch-toolbar" id="batchToolbar">
          <div class="batch-count">
            <span id="selectedCount">0</span> kartu dipilih
          </div>
          <div class="batch-toolbar-actions">
            <button class="btn-select-all" id="btnSelectAll">Pilih Semua</button>
            <button class="btn-batch-ship" id="btnBatchShip" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
                <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
              </svg>
              Kirim Batch
            </button>
          </div>
        </div>

        <div id="shipmentList" class="table-card">
          <div class="loading-state"><div class="spinner"></div><p>Memuat data pengiriman...</p></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Single Shipment -->
  <div class="modal-overlay" id="modalShipment">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Konfirmasi Pengiriman</h3>
        <button class="modal-close" id="modalShipmentClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="shipmentForm" class="modal-form">
        <input type="hidden" id="shipCardId" />
        <p class="modal-subtitle">Kartu: <strong id="shipCardName"></strong></p>
        <div class="form-group">
          <label for="shipBuyer">Nama Pembeli</label>
          <input type="text" id="shipBuyer" readonly />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="shipDate">Tanggal Kirim *</label>
            <input type="date" id="shipDate" required />
          </div>
          <div class="form-group">
            <label for="shipTracking">No. Resi *</label>
            <input type="text" id="shipTracking" required placeholder="JX123456789ID" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="cancelShipBtn">Batal</button>
          <button type="submit" class="btn-primary">Konfirmasi Terkirim</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Batch Shipment -->
  <div class="modal-overlay" id="modalBatchShipment">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Kirim Batch</h3>
        <button class="modal-close" id="modalBatchClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="batchShipForm" class="modal-form">
        <p class="modal-subtitle">Kartu yang akan dikirim dalam <strong>1 paket</strong>:</p>

        <!-- Daftar kartu yang dipilih -->
        <div class="batch-card-list" id="batchCardList"></div>
        <p class="batch-summary-note" id="batchSummaryNote"></p>

        <div class="form-row" style="margin-top:16px;">
          <div class="form-group">
            <label for="batchShipDate">Tanggal Kirim *</label>
            <input type="date" id="batchShipDate" required />
          </div>
          <div class="form-group">
            <label for="batchShipTracking">No. Resi *</label>
            <input type="text" id="batchShipTracking" required placeholder="JX123456789ID" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="cancelBatchShipBtn">Batal</button>
          <button type="submit" class="btn-primary" id="batchShipSubmitBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px">
              <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
              <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
            Konfirmasi Terkirim
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/shipment.js"></script>
</body>
</html>
