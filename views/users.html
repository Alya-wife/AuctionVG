<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Kelola Admin – NitipPro Card Inventory</title>
  <meta name="description" content="Kelola akun admin dan hak akses NitipPro" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h2>Kelola Admin &amp; Pengguna</h2>
          <span>Manajemen akun akses sistem NitipPro</span>
        </div>
        <div class="top-bar-right">
          <button class="btn-primary" id="btnAddUser">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Tambah Admin
          </button>
        </div>
      </header>

      <div class="content-body">
        <!-- Quick Stats -->
        <div class="stats-grid mb-3">
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(56, 189, 248, 0.15); color: #38bdf8;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Admin</span>
              <span class="stat-value" id="statTotalUsers">0</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(244, 114, 182, 0.15); color: #f472b6;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Admin Utama</span>
              <span class="stat-value" style="font-size: 1.15rem; color: #f472b6;">Pacar Alya</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(52, 211, 153, 0.15); color: #34d399;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="stat-info">
              <span class="stat-label">Status Database</span>
              <span class="stat-value" style="font-size: 1.15rem; color: #34d399;">Tersinkron</span>
            </div>
          </div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar mb-3">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="userSearch" placeholder="Cari nama atau username..." />
          </div>
          <select id="userRoleFilter" class="filter-select">
            <option value="">Semua Role</option>
            <option value="Admin">Admin</option>
            <option value="Pacar Alya">Pacar Alya</option>
            <option value="Moderator">Moderator</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <!-- Users Table Card -->
        <div class="table-card">
          <div class="table-card-header">
            <div style="font-weight: 700; font-size: 1rem; color: #fff;">Daftar Akun Admin</div>
            <div id="userCountBadge" style="font-size: 0.82rem; color: var(--text-muted);">Memuat...</div>
          </div>
          <div class="table-responsive">
            <table class="data-table" id="usersTable">
              <thead>
                <tr>
                  <th style="width: 260px;">Pengguna</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Password</th>
                  <th style="text-align: right; width: 140px;">Aksi</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 32px; color: var(--text-muted);">
                    <div class="spinner" style="margin: 0 auto 12px;"></div>
                    Memuat data pengguna...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Tambah / Edit Admin -->
  <div class="modal-overlay" id="modalUser">
    <div class="modal-box" style="max-width: 480px;">
      <div class="modal-header">
        <h3 id="modalUserTitle">Tambah Admin Baru</h3>
        <button class="modal-close" id="modalUserClose" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="userForm" class="modal-form">
        <input type="hidden" id="userOriginalUsername" />

        <div class="form-group">
          <label for="userNameInput">Nama Lengkap *</label>
          <input type="text" id="userNameInput" placeholder="Contoh: Budi Santoso" required />
        </div>

        <div class="form-group">
          <label for="userUsernameInput">Username *</label>
          <input type="text" id="userUsernameInput" placeholder="Contoh: budi_admin" autocomplete="off" required />
          <small class="form-hint" style="color: var(--text-muted); font-size: 0.76rem; margin-top: 4px;">Gunakan huruf kecil tanpa spasi.</small>
        </div>

        <div class="form-group">
          <label for="userPasswordInput">Password *</label>
          <div class="pwd-toggle-wrap">
            <input type="password" id="userPasswordInput" placeholder="Masukkan password login" autocomplete="new-password" required style="padding-right: 38px;" />
            <button type="button" class="pwd-toggle-btn" id="togglePasswordBtn" title="Lihat/Sembunyikan Password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="userRoleSelect">Role Akses</label>
          <select id="userRoleSelect" class="filter-select" style="width: 100%;">
            <option value="Admin">Admin</option>
            <option value="Pacar Alya">Pacar Alya</option>
            <option value="Moderator">Moderator</option>
            <option value="Staff">Staff</option>
          </select>
        </div>

        <div class="modal-actions" style="margin-top: 24px; display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn-ghost" id="cancelUserBtn">Batal</button>
          <button type="submit" class="btn-primary" id="saveUserBtn">
            <span id="saveUserBtnText">Simpan Admin</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/users.js"></script>
</body>
</html>
