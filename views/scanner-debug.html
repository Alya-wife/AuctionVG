<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Scanner Kartu Vanguard – NitipPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css?v=20261023_sb" />
  <style>
    .scanner-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 24px;
      max-width: 1050px;
      margin: 0 auto;
    }
    @media (max-width: 860px) {
      .scanner-container {
        grid-template-columns: 1fr;
      }
    }

    .scanner-card {
      background: var(--bg-card, #1e293b);
      border: 1px solid var(--border-color, #334155);
      border-radius: 12px;
      padding: 20px;
    }

    .upload-area {
      border: 2px dashed #4F8EF7;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      background: rgba(79, 142, 247, 0.05);
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .upload-area:hover {
      background: rgba(79, 142, 247, 0.12);
    }

    .img-box {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #0b1120;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 420px;
      margin-bottom: 14px;
    }
    .img-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-group-scan {
      margin-bottom: 14px;
    }
    .form-group-scan label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 5px;
    }
    .form-group-scan input,
    .form-group-scan select {
      width: 100%;
      padding: 9px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .form-group-scan input:focus,
    .form-group-scan select:focus {
      border-color: #38bdf8;
      outline: none;
    }

    .scan-status-msg {
      margin-top: 10px;
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .scan-status-msg.loading {
      display: block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .scan-status-msg.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .scan-status-msg.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburgerBtn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="page-title">
          <h2>Scanner Kartu Vanguard</h2>
        </div>
        <div class="top-bar-right">
          <button type="button" class="btn-ghost" id="btnApiKey" style="display: flex; align-items: center; gap: 6px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-1.5 1.5L12 11l-4-4-5 5 1.41 1.41L10 8.83l4 4 5.5-5.5L21 2z"/></svg>
            Set API Key
          </button>
        </div>
      </header>

      <div class="content-body" style="padding-top: 20px;">
        <div class="scanner-container">

          <!-- KOLOM KIRI: Upload & Preview -->
          <div class="scanner-card">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" />
            
            <div class="upload-area" id="dropArea">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#4F8EF7" stroke-width="2" style="margin-bottom: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <div style="font-weight: 600; font-size: 0.88rem; color: #f8fafc;">Klik untuk Masukkan Gambar</div>
              <div style="font-size: 0.74rem; color: #94a3b8; margin-top: 2px;">Bisa klik, drag-and-drop, atau Ctrl+V</div>
            </div>

            <div class="img-box">
              <img id="cardPreview" src="../assets/images/sample_card_dpr1705.png" alt="Preview Kartu" crossorigin="anonymous" />
            </div>

            <button type="button" class="btn-primary" id="btnScan" style="width: 100%; justify-content: center; padding: 12px; font-weight: 700; font-size: 0.95rem;">
              <span id="btnScanText">Scan Kartu</span>
            </button>

            <div id="statusMsg" class="scan-status-msg"></div>
          </div>

          <!-- KOLOM KANAN: Form Hasil Scan (Editable) -->
          <div class="scanner-card">
            <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 16px; color: #f8fafc;">Data Kartu</h3>

            <!-- Kotak Cari Cepat via Kode Kartu -->
            <div style="background: rgba(79, 142, 247, 0.08); border: 1px solid rgba(79, 142, 247, 0.25); border-radius: 8px; padding: 12px; margin-bottom: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <label for="quickCodeNumber" style="font-size: 0.78rem; font-weight: 700; color: #4F8EF7; margin: 0;">
                  Cari Kode Kartu
                </label>
                <!-- Switch Custom -->
                <label style="display: inline-flex; align-items: center; gap: 6px; font-size: 0.76rem; color: #94a3b8; cursor: pointer; user-select: none;">
                  <input type="checkbox" id="switchCustomPrefix" style="cursor: pointer; width: 14px; height: 14px; accent-color: #38bdf8;" />
                  <span>Custom</span>
                </label>
              </div>

              <!-- Input dengan Prefix D-PR/ -->
              <div style="display: flex; gap: 6px; align-items: stretch;">
                <div id="prefixBadge" style="display: flex; align-items: center; padding: 0 12px; background: rgba(56, 189, 248, 0.18); border: 1px solid #38bdf8; border-radius: 6px; color: #38bdf8; font-weight: 800; font-family: monospace; font-size: 0.95rem; user-select: none;">
                  D-PR/
                </div>
                <input type="text" id="quickCodeNumber" style="flex: 1; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; font-weight: 600;" autocomplete="off" />
                <button type="button" id="btnQuickSearch" class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem; white-space: nowrap; font-weight: 700;">
                  Cari Wiki
                </button>
              </div>
            </div>

            <form id="cardResultForm">
              <!-- HANYA 1 FIELD NAMA KARTU (ENGLISH) -->
              <div class="form-group-scan">
                <label for="nameEn">Nama Kartu</label>
                <input type="text" id="nameEn"  required />
              </div>

              <div class="form-group-scan" style="margin-bottom: 12px;">
                <label for="cardCode">Kode Kartu</label>
                <input type="text" id="cardCode"  required />
              </div>

              <div class="form-grid-2">
                <div class="form-group-scan">
                  <label for="grade">Grade</label>
                  <select id="grade">
                    <option value="0">Grade 0</option>
                    <option value="1">Grade 1</option>
                    <option value="2">Grade 2</option>
                    <option value="3">Grade 3</option>
                    <option value="4">Grade 4</option>
                  </select>
                </div>
                <div class="form-group-scan">
                  <label for="nation">Nation</label>
                  <select id="nation">
                    <option value="Dark States">Dark States</option>
                    <option value="Dragon Empire">Dragon Empire</option>
                    <option value="Lyrical Monasterio">Lyrical Monasterio</option>
                    <option value="Stoicheia">Stoicheia</option>
                    <option value="Brandt Gate">Brandt Gate</option>
                    <option value="Keter Sanctuary">Keter Sanctuary</option>
                  </select>
                </div>
              </div>

              <div class="form-grid-2">
                <div class="form-group-scan">
                  <label for="power">Power</label>
                  <input type="text" id="power"  />
                </div>
                <div class="form-group-scan">
                  <label for="shield">Shield</label>
                  <input type="text" id="shield"  />
                </div>
              </div>

              <div class="form-group-scan">
                <label for="cardSet">Set Promo</label>
                <input type="text" id="cardSet" list="setPromoList"  />
                <datalist id="setPromoList"></datalist>
              </div>

              <div style="margin-top: 24px; display: flex; gap: 10px;">
                <button type="button" class="btn-primary" id="btnSave" style="flex: 1; justify-content: center; padding: 11px;">
                  Simpan Kartu ke Database
                </button>
                <button type="button" class="btn-ghost" id="btnClear" style="padding: 11px 16px;">
                  Reset
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/auth.js?v=20261023_rbac"></script>
  <script src="../assets/js/cards-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js?v=20261023_rbac"></script>
  <script src="../assets/js/scanner-debug.js?v=20261023_wiki2"></script>
</body>
</html>
