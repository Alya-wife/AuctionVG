<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Nitip Card Inventory – Cari Kartu</title>
  <meta name="description" content="Cari kartu dan status kartu konsinyasi Nitip berdasarkan nama pemilik" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css?v=20261023_sb" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="login-page">
  <div class="login-bg">
    <div class="login-particles" id="particles"></div>
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <polygon points="20,2 38,12 38,28 20,38 2,28 2,12" fill="url(#hexGrad)" />
              <defs>
                <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#4F8EF7" />
                  <stop offset="100%" style="stop-color:#7B5CF7" />
                </linearGradient>
              </defs>
              <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" fill="white" font-size="16"
                font-weight="bold" font-family="Outfit">N</text>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Nitip</h1>
            <span>Card Inventory System</span>
          </div>
        </div>

        <p class="login-subtitle">Cari kartu berdasarkan nama pemilik</p>

        <!-- Public Search Section -->
        <div class="public-search-section">
          <div class="search-box-public">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="publicOwnerSearch" placeholder="Cari nama pemilik..." />
          </div>

          <div id="publicOwnerResults" class="public-owner-results">
            <div class="loading-state">
              <div class="spinner"></div>
              <p>Memuat data...</p>
            </div>
          </div>
        </div>

                <!-- Admin Google Sign-In -->
        <div class="login-link-section">
          <div class="admin-login-wrapper">
            <span class="admin-login-title">Login Khusus Admin</span>
            <div id="googleBtnContainer" class="google-btn-container">
              <div id="googleSignInBtn"></div>
            </div>
            <div id="loginError" class="login-error hidden" style="margin-top: 10px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
              </svg>
              <span id="loginErrorMsg">Login dengan Google gagal.</span>
            </div>
            <div id="loginSpinner" class="spinner hidden" style="margin-top: 8px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Owner Detail (Public) -->
  <div class="modal-overlay" id="modalPublicOwnerDetail">
    <div class="modal-box large" style="max-width: 960px;">
      <div class="modal-header">
        <div>
          <h3 id="publicOwnerDetailName" style="margin-bottom: 2px;">Detail Pemilik</h3>
          <span id="publicOwnerDetailTotal" style="font-size: 0.82rem; color: var(--text-muted);"></span>
        </div>
        <button class="modal-close" id="modalPublicOwnerDetailClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Status Division Tabs -->
      <div class="owner-status-tabs" id="publicOwnerStatusTabs"></div>

      <!-- Visual Card Gallery Grid (Images Only) -->
      <div id="publicOwnerCardsGrid" class="owner-cards-gallery-grid"></div>
    </div>
  </div>

  <!-- Modal: Public Card Detail Popup -->
  <div class="modal-overlay" id="modalPublicCardDetail" style="z-index: 1050;">
    <div class="modal-box" style="max-width: 500px;">
      <div class="modal-header">
        <h3 id="publicCardDetailTitle">Detail Kartu</h3>
        <button class="modal-close" id="modalPublicCardDetailClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div id="publicCardDetailBody" class="modal-form" style="padding: 20px;"></div>
    </div>
  </div>

        
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js?v=20261023_live4"></script>
  <script src="../assets/js/cards-data.js?v=20261023_live4"></script>
  <script src="../assets/js/auth.js?v=20261023_live4"></script>
  <script src="../assets/js/ui.js?v=20261023_live4"></script>
  <script src="../assets/js/index.js?v=20261023_live4"></script>
</body>

</html>
