<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Pembayaran – NitipPro Card Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(16,185,129,.1), rgba(5,150,105,.06));
      border: 1px solid rgba(16,185,129,.2);
      border-radius: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filter-bar label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-secondary, #8898aa);
      white-space: nowrap;
    }
    .filter-select {
      flex: 1;
      min-width: 120px;
      max-width: 200px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border, rgba(255,255,255,.1));
      background: #1e293b;
      color: #f0f4ff;
      font-size: .82rem;
      cursor: pointer;
      transition: border-color .2s;
    }
    .filter-select option {
      background: #0f172a;
      color: #f8fafc;
    }
    .filter-select:focus { outline: none; border-color: #10b981; }
    .filter-search {
      flex: 1;
      min-width: 140px;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border, rgba(255,255,255,.1));
      background: var(--bg-secondary, rgba(255,255,255,.06));
      color: var(--text-primary, #f0f4ff);
      font-size: .82rem;
      transition: border-color .2s;
    }
    .filter-search:focus { outline: none; border-color: #10b981; }
    .filter-search::placeholder { color: var(--text-muted, #6b7a90); }
    .btn-filter-clear {
      font-size: .78rem;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1.5px solid rgba(16,185,129,.3);
      background: transparent;
      color: #10b981;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-filter-clear:hover { background: rgba(16,185,129,.1); }

    /* ── Batch Toolbar ── */
    .batch-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(16,185,129,.12), rgba(5,150,105,.08));
      border: 1px solid rgba(16,185,129,.25);
      border-radius: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      transition: all .3s ease;
    }
    .batch-toolbar .batch-count {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text-secondary, #8898aa);
      flex: 1;
    }
    .batch-toolbar .batch-count span {
      color: #10b981;
      font-size: 1rem;
    }
    .batch-toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-select-all {
      font-size: .8rem;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid rgba(16,185,129,.4);
      background: transparent;
      color: #10b981;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s;
    }
    .btn-select-all:hover { background: rgba(16,185,129,.1); }
    .btn-batch-pay {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-weight: 700;
      font-size: .85rem;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(16,185,129,.4);
      transition: all .2s;
    }
    .btn-batch-pay:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(16,185,129,.5); }
    .btn-batch-pay:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* ── Checkbox column ── */
    .col-check { width: 44px; text-align: center; }
    .pay-checkbox {
      width: 18px; height: 18px;
      cursor: pointer;
      accent-color: #10b981;
    }
    .check-all-box {
      width: 18px; height: 18px;
      cursor: pointer;
      accent-color: #10b981;
    }
    tr.row-selected { background: rgba(16,185,129,.07) !important; }
    tr.row-selected td { border-color: rgba(16,185,129,.15) !important; }

    /* ── Batch modal card list ── */
    .batch-card-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border, rgba(255,255,255,.08));
      border-radius: 10px;
      margin-bottom: 4px;
      background: var(--bg-secondary, rgba(255,255,255,.03));
    }
    .batch-card-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border, rgba(255,255,255,.05));
      font-size: .85rem;
    }
    .batch-card-item:last-child { border-bottom: none; }
    .batch-card-item .bci-name { font-weight: 600; flex: 1; }
    .batch-card-item .bci-owner { color: var(--text-secondary, #8898aa); font-size: .78rem; }
    .batch-card-item .bci-price { color: #10b981; font-size: .8rem; font-weight: 600; }
    .batch-summary-note {
      font-size: .78rem;
      color: var(--text-secondary, #8898aa);
      margin-top: 6px;
      text-align: center;
    }

    /* Commission field highlight */
    .commission-hint {
      font-size: .75rem;
      color: var(--text-muted, #6b7a90);
      margin-top: 4px;
    }
    .commission-input-wrap {
      position: relative;
    }
    .commission-input-wrap .prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted, #6b7a90);
      font-size: .85rem;
      pointer-events: none;
    }
    .commission-input-wrap input {
      padding-left: 28px !important;
    }

    /* Batch commission per-item row */
    .bci-commission {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
    }
    .bci-commission input {
      width: 90px;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border, rgba(255,255,255,.1));
      background: var(--bg-secondary, rgba(255,255,255,.06));
      color: var(--text-primary, #f0f4ff);
      font-size: .78rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="main-content">
      <header class="top-bar">
        <button class="hamburger" id="hamburgerBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="page-title">
          <h2>Pembayaran Pemilik</h2>
          <span>Kartu dikirim, menunggu transfer ke pemilik</span>
        </div>
      </header>
      <div class="content-body">

        <!-- Filter Bar -->
        <div class="filter-bar" id="payFilterBar">
          <label>Filter:</label>
          <select class="filter-select" id="filterOwner" title="Filter Pemilik">
            <option value="">Semua Pemilik</option>
          </select>
          <select class="filter-select" id="filterBuyer" title="Filter Pembeli">
            <option value="">Semua Pembeli</option>
          </select>
          <input class="filter-search" type="search" id="filterSearch" placeholder="Cari nama kartu…" />
          <button class="btn-filter-clear" id="btnClearFilter">Reset</button>
        </div>

        <!-- Batch Toolbar -->
        <div class="batch-toolbar" id="batchToolbar">
          <div class="batch-count">
            <span id="selectedCount">0</span> kartu dipilih
          </div>
          <div class="batch-toolbar-actions">
            <button class="btn-select-all" id="btnSelectAll">Pilih Semua</button>
            <button class="btn-batch-pay" id="btnBatchPay" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
              </svg>
              Bayar Batch
            </button>
          </div>
        </div>

        <div id="paymentList" class="table-card">
          <div class="loading-state"><div class="spinner"></div><p>Memuat data pembayaran...</p></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal: Single Payment -->
  <div class="modal-overlay" id="modalPayment">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Konfirmasi Pembayaran ke Pemilik</h3>
        <button class="modal-close" id="modalPaymentClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="paymentForm" class="modal-form">
        <input type="hidden" id="payCardId" />
        <p class="modal-subtitle">Kartu: <strong id="payCardName"></strong></p>
        <p class="modal-subtitle">Pemilik: <strong id="payOwner"></strong> | Harga Jual: <strong id="payPrice"></strong></p>
        <div class="form-row">
          <div class="form-group">
            <label for="payDate">Tanggal Transfer *</label>
            <input type="date" id="payDate" required />
          </div>
          <div class="form-group">
            <label for="payCommission">Komisi (Rp)</label>
            <div class="commission-input-wrap">
              <span class="prefix">Rp</span>
              <input type="number" id="payCommission" min="0" step="500" placeholder="0" />
            </div>
            <div class="commission-hint">Komisi yang dipotong dari harga jual</div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="cancelPayBtn">Batal</button>
          <button type="submit" class="btn-primary">Selesaikan Transaksi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Batch Payment -->
  <div class="modal-overlay" id="modalBatchPayment">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Bayar Batch</h3>
        <button class="modal-close" id="modalBatchPayClose"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <form id="batchPayForm" class="modal-form">
        <p class="modal-subtitle">Kartu yang akan dibayarkan ke pemilik:</p>

        <!-- Daftar kartu + komisi per item -->
        <div class="batch-card-list" id="batchPayCardList"></div>
        <p class="batch-summary-note" id="batchPaySummaryNote"></p>

        <div class="form-row" style="margin-top:16px;">
          <div class="form-group">
            <label for="batchPayDate">Tanggal Transfer *</label>
            <input type="date" id="batchPayDate" required />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-ghost" id="cancelBatchPayBtn">Batal</button>
          <button type="submit" class="btn-batch-pay" id="batchPaySubmitBtn" style="border:none;padding:10px 22px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:6px">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            Konfirmasi Pembayaran
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/payment.js"></script>
</body>
</html>
